<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="FutureTime" />
  <meta name="theme-color" content="#000000" />
  <title>FutureTime</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    /* ── Responsive tokens ─────────────────────────────────── */
    :root {
      --gap:      32px;
      --picker-w: 210px;
      --picker-h: 148px;
      --label-sz: 11px;
      --item-sz:  34px;
      --item-h:   40px;
      --spacer-h: 50px;
    }
    /* iPhone 15 / regular */
    @media (min-width: 390px) {
      :root {
        --gap:      40px;
        --picker-w: 220px;
        --picker-h: 154px;
        --label-sz: 12px;
        --item-sz:  38px;
        --item-h:   44px;
        --spacer-h: 55px;
      }
    }
    /* iPad */
    @media (min-width: 768px) {
      :root {
        --gap:      60px;
        --picker-w: 300px;
        --picker-h: 180px;
        --label-sz: 14px;
        --item-sz:  46px;
        --item-h:   54px;
        --spacer-h: 65px;
      }
    }
    /* iPad Pro */
    @media (min-width: 1024px) {
      :root {
        --gap:      80px;
        --picker-w: 340px;
        --label-sz: 15px;
      }
    }

    body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 32px 24px;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
    }

    .label {
      color: rgba(255, 255, 255, 0.45);
      font-size: var(--label-sz);
      font-weight: 400;
      letter-spacing: clamp(2px, 0.4vw, 4px);
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .time-display {
      font-size: clamp(60px, 16vw, 96px);
      font-weight: 100;
      font-variant-numeric: tabular-nums;
      letter-spacing: -2px;
      line-height: 1;
    }

    #currentTime { color: #ffffff; }
    #futureTime  {
      color: #ff9500;
      font-size: clamp(76px, 20vw, 120px);
    }

    .gap { height: var(--gap); }

    /* ── Wheel picker ────────────────────────────────────────── */
    .picker-wrap {
      position: relative;
      width: var(--picker-w);
      height: var(--picker-h);
      overflow: hidden;
    }

    .picker-wrap::before,
    .picker-wrap::after {
      content: '';
      position: absolute;
      left: 0; right: 0;
      height: var(--spacer-h);
      z-index: 2;
      pointer-events: none;
    }
    .picker-wrap::before { top: 0;    background: linear-gradient(to bottom, #000 0%, transparent 100%); }
    .picker-wrap::after  { bottom: 0; background: linear-gradient(to top,    #000 0%, transparent 100%); }

    .picker-highlight {
      position: absolute;
      top: 50%; left: 0; right: 0;
      height: var(--item-h);
      transform: translateY(-50%);
      border-top:    1px solid rgba(255, 255, 255, 0.18);
      border-bottom: 1px solid rgba(255, 255, 255, 0.18);
      z-index: 1;
      pointer-events: none;
    }

    .picker-scroll {
      height: 100%;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .picker-scroll::-webkit-scrollbar { display: none; }

    .picker-item {
      height: var(--item-h);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: var(--item-sz);
      font-weight: 300;
      font-variant-numeric: tabular-nums;
      scroll-snap-align: center;
      color: #fff;
    }

    .picker-spacer {
      height: var(--spacer-h);
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <p class="label">Current time</p>
  <p class="time-display" id="currentTime">--:--</p>

  <div class="gap"></div>

  <p class="label">In how many hours?</p>
  <div class="picker-wrap">
    <div class="picker-highlight"></div>
    <div class="picker-scroll" id="pickerScroll"></div>
  </div>

  <div class="gap"></div>

  <p class="label">It will be</p>
  <p class="time-display" id="futureTime">--:--</p>

  <script>
    // ── Helpers ──────────────────────────────────────────────
    function fmt(date) {
      return String(date.getHours()).padStart(2, '0') + ':' +
             String(date.getMinutes()).padStart(2, '0');
    }

    // Read --item-h from CSS so snap math is correct at every breakpoint
    function itemHeight() {
      return parseFloat(getComputedStyle(document.documentElement)
        .getPropertyValue('--item-h')) || 44;
    }

    // ── State ─────────────────────────────────────────────────
    let selectedHours = 1;

    // ── Clock ─────────────────────────────────────────────────
    function tick() {
      const now = new Date();
      document.getElementById('currentTime').textContent = fmt(now);
      const future = new Date(now.getTime() + selectedHours * 3_600_000);
      document.getElementById('futureTime').textContent = fmt(future);
    }
    tick();
    setInterval(tick, 10_000);

    // ── Picker ────────────────────────────────────────────────
    const HOURS  = 23;
    const scroll = document.getElementById('pickerScroll');

    const topSpacer = document.createElement('div');
    topSpacer.className = 'picker-spacer';
    scroll.appendChild(topSpacer);

    for (let i = 1; i <= HOURS; i++) {
      const el = document.createElement('div');
      el.className = 'picker-item';
      el.textContent = i;
      scroll.appendChild(el);
    }

    const botSpacer = document.createElement('div');
    botSpacer.className = 'picker-spacer';
    scroll.appendChild(botSpacer);

    requestAnimationFrame(() => { scroll.scrollTop = 0; });

    let scrollTimer;
    scroll.addEventListener('scroll', () => {
      clearTimeout(scrollTimer);
      scrollTimer = setTimeout(() => {
        const IH = itemHeight();
        const index = Math.round(scroll.scrollTop / IH);
        selectedHours = Math.min(Math.max(index + 1, 1), HOURS);
        scroll.scrollTo({ top: index * IH, behavior: 'smooth' });
        tick();
      }, 80);
    });

    // Re-snap on resize (orientation change, split-view resize on iPad)
    window.addEventListener('resize', () => {
      const IH = itemHeight();
      const index = selectedHours - 1;
      scroll.scrollTo({ top: index * IH, behavior: 'instant' });
    });
  </script>
</body>
</html>
