<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="FutureTime" />
  <meta name="theme-color" content="#000000" />
  <title>FutureTime</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 32px 24px;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
    }

    .label {
      color: rgba(255, 255, 255, 0.45);
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .time-display {
      font-size: clamp(64px, 18vw, 88px);
      font-weight: 100;
      font-variant-numeric: tabular-nums;
      letter-spacing: -2px;
      line-height: 1;
    }

    #currentTime { color: #ffffff; }
    #futureTime  { color: #ff9500; font-size: clamp(80px, 22vw, 108px); }

    .gap { height: 48px; }
    .gap-sm { height: 16px; }

    /* ── Wheel picker ── */
    .picker-wrap {
      position: relative;
      width: 220px;
      height: 154px;
      overflow: hidden;
    }

    /* fade top & bottom */
    .picker-wrap::before,
    .picker-wrap::after {
      content: '';
      position: absolute;
      left: 0; right: 0;
      height: 55px;
      z-index: 2;
      pointer-events: none;
    }
    .picker-wrap::before { top: 0;    background: linear-gradient(to bottom, #000 0%, transparent 100%); }
    .picker-wrap::after  { bottom: 0; background: linear-gradient(to top,    #000 0%, transparent 100%); }

    /* selection band */
    .picker-highlight {
      position: absolute;
      top: 50%; left: 0; right: 0;
      height: 44px;
      transform: translateY(-50%);
      border-top:    1px solid rgba(255,255,255,0.18);
      border-bottom: 1px solid rgba(255,255,255,0.18);
      z-index: 1;
      pointer-events: none;
    }

    .picker-scroll {
      height: 100%;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .picker-scroll::-webkit-scrollbar { display: none; }

    .picker-item {
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      font-weight: 300;
      font-variant-numeric: tabular-nums;
      scroll-snap-align: center;
      color: #fff;
    }

    /* spacers so first/last item can reach centre */
    .picker-spacer { height: 55px; flex-shrink: 0; }
  </style>
</head>
<body>

  <p class="label">Current time</p>
  <p class="time-display" id="currentTime">--:--</p>

  <div class="gap"></div>

  <p class="label">In how many hours?</p>
  <div class="picker-wrap">
    <div class="picker-highlight"></div>
    <div class="picker-scroll" id="pickerScroll"></div>
  </div>

  <div class="gap"></div>

  <p class="label">It will be</p>
  <p class="time-display" id="futureTime">--:--</p>

  <script>
    // ── Helpers ─────────────────────────────────────────────
    function fmt(date) {
      const h = String(date.getHours()).padStart(2, '0');
      const m = String(date.getMinutes()).padStart(2, '0');
      return h + ':' + m;
    }

    // ── State ────────────────────────────────────────────────
    let selectedHours = 1;

    // ── Clock ────────────────────────────────────────────────
    function tick() {
      const now = new Date();
      document.getElementById('currentTime').textContent = fmt(now);
      const future = new Date(now.getTime() + selectedHours * 3_600_000);
      document.getElementById('futureTime').textContent = fmt(future);
    }
    tick();
    setInterval(tick, 10_000);   // refresh every 10 s

    // ── Picker ───────────────────────────────────────────────
    const ITEM_H   = 44;
    const HOURS    = 23;
    const scroll   = document.getElementById('pickerScroll');

    // top spacer
    const topSpacer = document.createElement('div');
    topSpacer.className = 'picker-spacer';
    scroll.appendChild(topSpacer);

    for (let i = 1; i <= HOURS; i++) {
      const el = document.createElement('div');
      el.className = 'picker-item';
      el.textContent = i;
      scroll.appendChild(el);
    }

    // bottom spacer
    const botSpacer = document.createElement('div');
    botSpacer.className = 'picker-spacer';
    scroll.appendChild(botSpacer);

    // scroll to item 1 (index 0)
    requestAnimationFrame(() => { scroll.scrollTop = 0; });

    let scrollTimer;
    scroll.addEventListener('scroll', () => {
      clearTimeout(scrollTimer);
      scrollTimer = setTimeout(() => {
        const index = Math.round(scroll.scrollTop / ITEM_H);
        selectedHours = Math.min(Math.max(index + 1, 1), HOURS);
        // snap cleanly
        scroll.scrollTo({ top: index * ITEM_H, behavior: 'smooth' });
        tick();
      }, 80);
    });
  </script>
</body>
</html>
